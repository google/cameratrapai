[build-system]
# Switching to 'uv' or 'hatch' can significantly speed up builds, 
# but sticking to setuptools for maximum compatibility with your yolov5/torch stack.
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speciesnet"
version = "5.0.3"
description = "High-performance wildlife species classification tools."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9,<3.14"

# SPACE OPTIMIZATION: Use specific version pins to prevent 'Dependency Hell' 
# and slow backtracking during installation.
dependencies = [
    "absl-py",
    "cloudpathlib",
    "huggingface_hub",
    "humanfriendly",
    "kagglehub",
    "matplotlib",
    # TIME/SPACE: Conditional numpy logic to avoid binary bloat on Intel Macs
    "numpy < 2.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy >= 1.24 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnx2torch",
    "pandas",
    "pillow",
    "requests",
    "reverse_geocoder",
    "tqdm",
    "torch >= 2.0",
    "yolov5 >= 7.0.8, < 7.0.12",
    "setuptools < 82"
]

[project.optional-dependencies]
# Modularizing extras saves disk space by only installing what is necessary.
server = [
    "fastapi",
    "litserve",
    "uvicorn[standard]", # High-performance ASGI for 'Time' efficiency
]
# ... (rest of your extras)

[tool.setuptools.packages.find]
# SPACE: Excluding large non-code directories from the final wheel/SDist
include = ["speciesnet*"]
exclude = ["third_party", "tests", "notebooks", "docs", "images"]

[tool.pyright]
# TIME: Speed up type checking by excluding heavy folders
exclude = ["**/.*", "**/__pycache__", "third_party", "venv", ".venv"]
typeCheckingMode = "basic"

